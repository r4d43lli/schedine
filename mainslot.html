<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Casino Slot PRO</title>
    <link rel="stylesheet" href="slotstyle.css">
</head>

<body>

<div class="game">

    <h1>🎰 CASINO SLOT PRO</h1>

    <div class="stats">
        💰 Credito: <span id="credit">100</span>
    </div>

    <div class="bet-area">
        Puntata:
        <input type="number" id="bet" value="10" min="1">
    </div>

    <div class="slot">
        <div class="reel" id="r1">🍒</div>
        <div class="reel" id="r2">🍋</div>
        <div class="reel" id="r3">🍉</div>
    </div>

    <button onclick="spin()" id="spinBtn">SPIN</button>

    <div id="result"></div>

</div>

<script src="scriptslot.js"></script>
</body>
</html>
